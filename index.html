<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>傅亿霞 · 作业一作品索引</title>
  <style>
    /* ===== 门户页：与作品同一套暖色系 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f7a0be;                          /* 与作品背景同色 */
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 30px; padding: 40px;
    }
    h1 { color: #731023; font-size: 32px; letter-spacing: 4px; }
    p  { color: #fce9dc; font-size: 15px; }
    .cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
    a.card {
      display: block; width: 250px; padding: 30px 26px;
      background: #fce9dc; border-radius: 18px;
      text-decoration: none; color: #731023;
      box-shadow: 0 8px 0 #e88aa9;
      transition: transform .15s;
    }
    a.card:hover { transform: translateY(-5px); }
    a.card h2 { font-size: 20px; margin-bottom: 10px; }
    a.card span { font-size: 14px; color: #f2642d; }
  </style>
</head>
<body>
  <h1>傅亿霞 · 几何构成作业一</h1>
  <p>数字媒体艺术 · p5.js · 两个作品</p>
  <div class="cards">
    <a class="card" href="static.html">
      <h2>几何构成（静态）</h2>
      <span>点按进入 → static.html</span>
    </a>
    <a class="card" href="dynamic.html">
      <h2>运动轨迹（交互动态）</h2>
      <span>点按进入 → dynamic.html</span>
    </a>
  </div>
</body>
</html>
